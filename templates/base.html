{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MetaBase</title>
  <link rel="shortcut icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
  <link rel="icon" href="{% static 'favicon.ico' %}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'favicon-32x32.png' %}">
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'apple-touch-icon.png' %}">
  <script>
    (function(){try{var k='biotaSiteTheme',l=localStorage.getItem('adminTestLabTheme');if(l&&!localStorage.getItem(k))localStorage.setItem(k,l);var v=localStorage.getItem(k);document.documentElement.setAttribute('data-theme',v==='dawn'?'dawn':'night');}catch(e){document.documentElement.setAttribute('data-theme','night');}})();
  </script>
  <link rel="stylesheet" href="{% static 'css/biota_global.css' %}">
</head>
<body class="{% if auth_page %}auth-page{% endif %}" data-biota-can-edit="{% if biota_can_edit %}1{% else %}0{% endif %}">
  {% if not hide_nav %}
  <div class="nav">
    {% include "shifts/includes/biota_nav_fragment.html" %}
  </div>
  {% endif %}
  <div class="container">
    {% if messages %}
    <ul class="messages">
      {% for message in messages %}
      <li class="message{% if message.tags == 'success' %} message--success{% elif message.tags == 'error' %} message--error{% else %} message--info{% endif %}">{{ message }}</li>
      {% endfor %}
    </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </div>

  <script>
    (function () {
      var KEY = "biotaSiteTheme";
      function apply(name) {
        var v = name === "dawn" ? "dawn" : "night";
        document.documentElement.setAttribute("data-theme", v);
        try {
          localStorage.setItem(KEY, v);
        } catch (_e) {}
        var btn = document.getElementById("biota-theme-toggle");
        if (btn) {
          btn.setAttribute("aria-pressed", v === "dawn" ? "true" : "false");
          btn.textContent = v === "dawn" ? "☀" : "☾";
          btn.title = v === "dawn" ? "Переключить на ночную тему" : "Тема «Рассвет» (светлая)";
        }
        try {
          window.dispatchEvent(new CustomEvent("biota-theme-change", { detail: { theme: v } }));
        } catch (_e2) {}
      }
      window.biotaSetSiteTheme = apply;
      var btnInit = document.getElementById("biota-theme-toggle");
      if (btnInit) {
        var cur = document.documentElement.getAttribute("data-theme") || "night";
        btnInit.setAttribute("aria-pressed", cur === "dawn" ? "true" : "false");
        btnInit.textContent = cur === "dawn" ? "☀" : "☾";
        btnInit.title =
          cur === "dawn"
            ? "Переключить на ночную тему"
            : "Тема «Рассвет» (светлая)";
        btnInit.addEventListener("click", function () {
          var c = document.documentElement.getAttribute("data-theme") || "night";
          apply(c === "dawn" ? "night" : "dawn");
        });
      }
    })();
    (function () {
      var canEdit = document.body && document.body.getAttribute("data-biota-can-edit") === "1";
      if (canEdit) return;
      /* Раздел «План»: не блокируем POST на клиенте — права проверяются на сервере (исполнитель иначе не видит реакции на «Сохранить»). */
      var path = window.location.pathname || "";
      if (path === "/plan" || path.indexOf("/plan/") === 0) return;
      document.querySelectorAll('form').forEach(function (form) {
        var method = (form.getAttribute("method") || "get").toLowerCase();
        if (method !== "post") return;
        form.addEventListener("submit", function (event) {
          event.preventDefault();
        });
        form.querySelectorAll('button[type="submit"], input[type="submit"]').forEach(function (btn) {
          btn.disabled = true;
          btn.title = "Роль «исполнитель»: только просмотр и скачивание";
        });
      });
    })();
    (function () {
      var forms = document.querySelectorAll("form.auto-submit-form");
      if (!forms.length) return;

      function submitForm(form) {
        if (form.dataset.submitting === "1") return;
        form.dataset.submitting = "1";
        form.submit();
      }

      forms.forEach(function (form) {
        var timer = null;
        form.addEventListener("change", function (event) {
          var t = event.target;
          if (!t || t.name === "action" || t.type === "file") return;
          submitForm(form);
        });

        form.addEventListener("input", function (event) {
          var t = event.target;
          if (!t || (t.tagName !== "INPUT" && t.tagName !== "TEXTAREA")) return;
          if (t.type && t.type !== "search" && t.type !== "text" && t.type !== "number") return;
          if (timer) clearTimeout(timer);
          timer = setTimeout(function () { submitForm(form); }, 350);
        });
      });
    })();
    (function () {
      var refreshForm = document.querySelector(".nav-refresh-form");
      if (!refreshForm) return;
      var btn = refreshForm.querySelector(".nav-refresh-btn");
      if (!btn) return;
      refreshForm.addEventListener("submit", function () {
        btn.classList.add("is-loading");
        btn.setAttribute("aria-label", "Обновление данных из БД...");
      });
    })();
    (function () {
      var nav = document.querySelector(".nav");
      if (!nav) return;
      var drops = nav.querySelectorAll("details.nav-dropdown");
      if (!drops.length) return;
      drops.forEach(function (d) {
        d.addEventListener("toggle", function () {
          if (!d.open) return;
          drops.forEach(function (other) {
            if (other !== d) other.removeAttribute("open");
          });
        });
      });
      document.addEventListener("click", function (ev) {
        if (!nav.contains(ev.target)) {
          drops.forEach(function (d) { d.removeAttribute("open"); });
        }
      });
    })();
  </script>
</body>
</html>
