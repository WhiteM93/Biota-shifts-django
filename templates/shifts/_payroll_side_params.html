{% load l10n %}
{% localize off %}
<div class="pr-params">
  <fieldset class="pr-params__block">
    <legend class="pr-params__legend">Доли от суммы</legend>
    <div class="pr-params__sliders">
      <label class="pr-slider pr-slider--compact">
        <div class="pr-slider__head">
          <span class="pr-slider__label">Качество</span>
          <span class="pr-slider__value"><output id="pr-out-quality" for="pr-range-quality">0</output>%</span>
        </div>
        <input type="range" id="pr-range-quality" class="payroll-live-field pr-slider__input" name="penalty_quality_pct"
          min="0" max="20" step="0.5" value="{{ side_effective.penalty_quality_pct|default_if_none:20 }}">
      </label>
      <label class="pr-slider pr-slider--compact">
        <div class="pr-slider__head">
          <span class="pr-slider__label">Результат</span>
          <span class="pr-slider__value"><output id="pr-out-result" for="pr-range-result">0</output>%</span>
        </div>
        <input type="range" id="pr-range-result" class="payroll-live-field pr-slider__input" name="penalty_result_pct"
          min="0" max="20" step="0.5" value="{{ side_effective.penalty_result_pct|default_if_none:20 }}">
      </label>
      <label class="pr-slider pr-slider--compact">
        <div class="pr-slider__head">
          <span class="pr-slider__label">Режим</span>
          <span class="pr-slider__value"><output id="pr-out-mode" for="pr-range-mode">0</output>%</span>
        </div>
        <input type="range" id="pr-range-mode" class="payroll-live-field pr-slider__input" name="penalty_mode_pct"
          min="0" max="10" step="0.5" value="{{ side_effective.penalty_mode_pct|default_if_none:10 }}">
      </label>
    </div>
  </fieldset>

  <fieldset class="pr-params__block pr-params__block--last">
    <legend class="pr-params__legend">Премия и штраф</legend>
    <label class="pr-slider pr-slider--compact">
      <div class="pr-slider__head">
        <span class="pr-slider__label">Премия %</span>
        <span class="pr-slider__value"><output id="pr-out-bonus-pct" for="pr-range-bonus-pct">0</output>%</span>
      </div>
      <input type="range" id="pr-range-bonus-pct" class="payroll-live-field pr-slider__input" name="bonus_percent"
        min="0" max="50" step="0.5" value="{{ side_effective.bonus_percent|default_if_none:0 }}">
    </label>
    <div class="pr-params__money">
      <label class="pr-input-row pr-input-row--compact">
        <span class="pr-input-row__label">Премия ₽</span>
        <input type="text" name="bonus_rub" inputmode="decimal" value="{{ side_effective.bonus_rub }}" class="payroll-live-field pr-input-row__control" autocomplete="off">
      </label>
      <label class="pr-input-row pr-input-row--compact">
        <span class="pr-input-row__label">Штраф ₽</span>
        <input type="text" name="penalty_rub" inputmode="decimal" value="{{ side_effective.penalty_rub }}" class="payroll-live-field pr-input-row__control" autocomplete="off">
      </label>
    </div>
  </fieldset>
</div>
{% endlocalize %}
