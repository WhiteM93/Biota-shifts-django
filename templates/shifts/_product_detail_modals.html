<div id="setup-photo-modal" class="setup-photo-modal" hidden>
  <div class="setup-photo-modal-backdrop" data-close-photo-modal="1"></div>
  <div class="setup-photo-modal-dialog" role="dialog" aria-modal="true" aria-label="Просмотр фото">
    <button type="button" class="setup-photo-modal-close btn btn-ghost" id="setup-photo-modal-close">×</button>
    <img id="setup-photo-modal-img" src="" alt="" />
    <p id="setup-photo-modal-caption" class="muted" style="margin:8px 0 0 0;"></p>
  </div>
</div>
<div id="setup-piece-norm-history-modal" class="setup-piece-norm-history-modal" hidden aria-hidden="true">
  <div class="setup-piece-norm-history-modal-backdrop" data-close-piece-norm-hist="1"></div>
  <div class="setup-piece-norm-history-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="setup-piece-norm-hist-title">
    <div class="setup-piece-norm-history-modal-head">
      <h2 id="setup-piece-norm-hist-title" class="setup-piece-norm-history-modal-title">История норм Т<sub>шт</sub></h2>
      <button type="button" class="btn btn-ghost" data-close-piece-norm-hist="1" aria-label="Закрыть">×</button>
    </div>
    <div class="setup-piece-norm-history-list" id="setup-piece-norm-hist-list"></div>
  </div>
</div>
<div id="binding-photo-preview-pop" class="binding-photo-preview-pop" hidden aria-hidden="true">
  <img src="" alt="" decoding="async" />
</div>
<div id="setup-tool-note-pop" class="setup-tool-note-pop" hidden aria-hidden="true" role="tooltip"></div>
<div id="setup-tool-note-edit-modal" class="setup-tool-note-edit-modal" hidden aria-hidden="true">
  <div class="setup-tool-note-edit-modal-backdrop" data-close-setup-tool-note="1"></div>
  <div class="setup-tool-note-edit-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="setup-tool-note-edit-title">
    <h2 id="setup-tool-note-edit-title" class="setup-tool-note-edit-modal-title">Примечание к инструменту</h2>
    <textarea class="setup-tool-note-edit-modal-input js-setup-tool-note-edit-input" rows="5" maxlength="300" placeholder="Текст примечания"></textarea>
    <div class="setup-tool-note-edit-modal-actions">
      <button type="button" class="btn btn-ghost" data-close-setup-tool-note="1">Отмена</button>
      <button type="button" class="btn btn-primary js-setup-tool-note-edit-save">Сохранить</button>
    </div>
  </div>
</div>
<div id="setup-program-preview-modal" class="setup-program-preview-modal" hidden aria-hidden="true">
  <div class="setup-program-preview-modal-backdrop" data-close-setup-program-preview="1"></div>
  <div class="setup-program-preview-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="setup-program-preview-title">
    <div class="setup-program-preview-modal-head">
      <div class="setup-program-preview-modal-head-top">
        <h2 id="setup-program-preview-title" class="setup-program-preview-modal-title">Программа</h2>
        <div class="setup-program-preview-modal-head-actions">
          <a href="#" class="btn btn-ghost setup-program-preview-download js-setup-program-preview-download" download hidden>Скачать</a>
          <button type="button" class="btn btn-ghost" data-close-setup-program-preview="1" aria-label="Закрыть">×</button>
        </div>
      </div>
      <div class="setup-program-preview-modal-search" role="search">
        <input
          type="search"
          class="setup-program-preview-search-input js-setup-program-preview-search"
          placeholder="Поиск в программе…"
          autocomplete="off"
          spellcheck="false"
          aria-label="Поиск в программе"
        >
        <span class="setup-program-preview-search-count js-setup-program-preview-search-count muted" aria-live="polite" hidden>0/0</span>
        <button type="button" class="btn btn-ghost setup-program-preview-search-nav js-setup-program-preview-search-prev" aria-label="Предыдущее совпадение" title="Предыдущее (Shift+Enter)">↑</button>
        <button type="button" class="btn btn-ghost setup-program-preview-search-nav js-setup-program-preview-search-next" aria-label="Следующее совпадение" title="Следующее (Enter)">↓</button>
      </div>
    </div>
    <div class="setup-program-preview-modal-status muted js-setup-program-preview-status" hidden></div>
    <pre class="setup-program-preview-code js-setup-program-preview-code" tabindex="0" aria-label="Текст программы"><code></code></pre>
  </div>
</div>
<div id="setup-load-machine-modal" class="setup-load-machine-modal" hidden aria-hidden="true">
  <div class="setup-load-machine-modal-backdrop" data-close-setup-load-machine="1"></div>
  <div class="setup-load-machine-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="setup-load-machine-title">
    <div class="setup-load-machine-modal-head">
      <h2 id="setup-load-machine-title" class="setup-load-machine-modal-title">Загрузить в станок</h2>
      <button type="button" class="btn btn-ghost" data-close-setup-load-machine="1" aria-label="Закрыть">×</button>
    </div>
    <p class="muted setup-load-machine-modal-hint">Выберите станок — в «В работе» встанет это изделие и установка. В списке инструмента станка заменятся только совпадающие номера (T01, T02…).</p>
    <p class="setup-load-machine-modal-setup muted" id="setup-load-machine-setup-label"></p>
    <div class="setup-load-machine-list" id="setup-load-machine-list" role="list"></div>
    <p class="setup-load-machine-empty muted" id="setup-load-machine-empty" hidden>Станки не найдены. Добавьте их на странице «Станки».</p>
  </div>
</div>
