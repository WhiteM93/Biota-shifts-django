{% load static %}
<div
  id="inv-chat"
  class="inv-chat"
  data-url="{% url 'inventory_chat_api' %}"
  data-csrf="{{ csrf_token }}"
  {% if biota_is_admin %}data-archive-url="{% url 'inventory_ai_archive' %}" data-notebook-url="{% url 'site_notebook' %}"{% endif %}
>
  <button type="button" class="inv-chat-fab js-inv-chat-fab" aria-expanded="false" aria-controls="inv-chat-panel" title="MetaGPT" aria-label="MetaGPT">MetaGPT</button>
  <div id="inv-chat-panel" class="inv-chat-panel js-inv-chat-panel" hidden role="dialog" aria-label="MetaGPT">
    <div class="inv-chat-head">
      <h3>MetaGPT</h3>
      <div class="inv-chat-head-actions">
        {% if biota_is_admin %}
        <a class="inv-chat-icon-btn" href="{% url 'site_notebook' %}" title="Блокнот доработок">✎</a>
        <a class="inv-chat-icon-btn" href="{% url 'inventory_ai_archive' %}" title="Архив диалогов">⧉</a>
        {% endif %}
        <button type="button" class="inv-chat-icon-btn js-inv-chat-clear" title="Очистить">⌫</button>
        <button type="button" class="inv-chat-icon-btn js-inv-chat-close" title="Закрыть" aria-label="Закрыть">×</button>
      </div>
    </div>
    <p class="inv-chat-limit-hint">Не чаще 1 раза в минуту (админ — без лимита).</p>
    <p class="inv-chat-page-hint js-inv-chat-page-hint" hidden></p>
    <div class="inv-chat-hints js-inv-chat-hints"></div>
    <div class="inv-chat-messages js-inv-chat-messages" aria-live="polite"></div>
    <form class="inv-chat-form js-inv-chat-form">
      <textarea class="js-inv-chat-input" rows="2" maxlength="1500" placeholder="Склад или «запиши в блокнот: …»"></textarea>
      <button type="submit" class="js-inv-chat-send">Спросить</button>
    </form>
  </div>
</div>
<script src="{% static 'shifts/js/inventory_chat.js' %}?v={{ static_asset_version }}" defer></script>
