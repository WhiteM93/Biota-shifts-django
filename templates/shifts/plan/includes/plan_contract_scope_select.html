<div class="plan-rail-contract-wrap plan-contract-scope-select">
  <label class="plan-rail-contract-label">
    <span class="plan-rail-contract-label-span">Контракт</span>
    <select class="plan-rail-contract-select" data-plan-rail-contract-select autocomplete="off">
      <option value="">Все</option>
      {% for c in contracts_for_rail %}
      <option
        value="{{ c.pk }}"
        {% if plan_rail_selected_contract_pk == c.pk %}selected{% endif %}
        title="{% if c.title %}{{ c.title }} · {% endif %}до {{ c.deadline|date:'d.m.Y' }} (#{{ c.pk }})">
        {% if c.title %}{{ c.title|truncatechars:28 }}{% else %}Без названия{% endif %} · {{ c.deadline|date:"d.m.Y" }}
      </option>
      {% endfor %}
    </select>
  </label>
</div>
