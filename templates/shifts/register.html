{% extends "base.html" %}
{% load static %}

{% block extra_styles %}
<link rel="stylesheet" href="{% static 'shifts/css/auth.css' %}?v={{ static_asset_version }}">
{% endblock %}

{% block content %}
<div class="auth-shell">
  <header class="auth-header">
    <div class="auth-header-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <line x1="19" y1="8" x2="19" y2="14"/>
        <line x1="22" y1="11" x2="16" y2="11"/>
      </svg>
    </div>
    <div>
      <h1 class="auth-title">Регистрация</h1>
      <p class="auth-subtitle">Логин: латиница, цифры, _. Пароль — от 8 символов.</p>
    </div>
  </header>

  <section class="auth-glass-card">
    {% if error %}
    <p class="auth-alert" role="alert">{{ error }}</p>
    {% endif %}

    <form method="post" action="" class="auth-form">
      {% csrf_token %}

      <label class="auth-field">
        <span class="auth-label">Логин</span>
        <input class="auth-input" name="username" autocomplete="username" required minlength="3" maxlength="32" autofocus>
      </label>

      <label class="auth-field">
        <span class="auth-label">Пароль</span>
        <input class="auth-input" name="password" type="password" autocomplete="new-password" required minlength="8">
      </label>

      <label class="auth-field">
        <span class="auth-label">Пароль ещё раз</span>
        <input class="auth-input" name="password2" type="password" autocomplete="new-password" required minlength="8">
      </label>

      <button class="auth-submit-btn" type="submit">Зарегистрироваться</button>
    </form>

    <p class="auth-footer">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>

    <div class="auth-theme-row">
      <button type="button" class="nav-theme-btn" id="biota-theme-toggle" aria-pressed="false" title="Тема «Рассвет» (светлая)">☾</button>
    </div>
  </section>
</div>
{% endblock %}
