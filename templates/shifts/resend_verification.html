{% extends "base.html" %}
{% load static %}

{% block extra_styles %}
<link rel="stylesheet" href="{% static 'shifts/css/auth.css' %}?v={{ static_asset_version }}">
{% endblock %}

{% block content %}
<div class="auth-shell">
  <header class="auth-header">
    <div>
      <h1 class="auth-title">Повторная отправка</h1>
      <p class="auth-subtitle">Укажите логин или email, указанный при регистрации.</p>
    </div>
  </header>

  <section class="auth-glass-card">
    {% if error %}
    <p class="auth-alert" role="alert">{{ error }}</p>
    {% endif %}

    <form method="post" action="" class="auth-form">
      {% csrf_token %}
      <label class="auth-field">
        <span class="auth-label">Логин</span>
        <input class="auth-input" name="username" autocomplete="username">
      </label>
      <p class="auth-or muted">или</p>
      <label class="auth-field">
        <span class="auth-label">Email</span>
        <input class="auth-input" name="email" type="email" autocomplete="email">
      </label>
      <button class="auth-submit-btn" type="submit">Отправить письмо</button>
    </form>

    <p class="auth-footer"><a href="{% url 'login' %}">Назад ко входу</a></p>
  </section>
</div>
{% endblock %}
